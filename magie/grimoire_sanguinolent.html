<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="./livre.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap"
    rel="stylesheet" />
  <title>Le Grimoire Sanguinolent — Legends & Bonk</title>
  <meta name="description" content="Le Grimoire Sanguinolent de Legends & Bonk : les sorts de sang des hématomanciens de notre jeu de rôle." />
  <link rel="canonical" href="https://legendsandbonk.com/magie/grimoire_sanguinolent.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Legends &amp; Bonk" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Le Grimoire Sanguinolent — Legends & Bonk" />
  <meta property="og:description" content="Le Grimoire Sanguinolent de Legends & Bonk : les sorts de sang des hématomanciens de notre jeu de rôle." />
  <meta property="og:url" content="https://legendsandbonk.com/magie/grimoire_sanguinolent.html" />
  <meta property="og:image" content="https://legendsandbonk.com/image/image_pala_presentation.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../image/logo_l_and_b.png" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <style>
    /* ================= THÈME SANGUIN =================
       La structure du livre vient de livre.css (partagée avec le
       Grand Livre de la Magie) : ici on ne redéfinit que les couleurs
       et les taches de sang. */
    .grimoire-titre { color: #4a0e0e; }
    .grimoire-sous-titre { color: #7c3a2a; }

    .recherche-sort input {
      border-color: #7a2a20;
      color: #3b1512;
    }

    .recherche-sort input:focus { border-color: #b8442f; box-shadow: 0 0 0 3px rgba(184, 68, 47, .35); }

    /* --------- Couverture : cuir rouge-noir --------- */
    .cuir {
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.55' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.12'/></svg>"),
        radial-gradient(ellipse at 50% 40%, rgba(150, 35, 25, .38), transparent 75%),
        linear-gradient(120deg, #2a0808, #4a1010 45%, #260606 90%);
      box-shadow: inset 0 0 90px rgba(0, 0, 0, .78), inset 0 0 12px rgba(0, 0, 0, .6);
      color: #d89a86;
    }

    .couverture-cadre {
      border-color: #8a3a2a;
      box-shadow: 0 0 12px rgba(216, 130, 106, .18), inset 0 0 12px rgba(216, 130, 106, .12);
    }

    .couverture-coin { color: #a83a2a; text-shadow: 0 0 6px rgba(216, 120, 100, .5); }
    .couverture-titre { text-shadow: 0 2px 3px rgba(0, 0, 0, .9), 0 0 18px rgba(216, 110, 90, .25); }
    .couverture-orne { color: #a83a2a; }
    .couverture-marque { color: #a8705e; }
    .couverture-hint { color: rgba(220, 150, 130, .65); }

    /* --------- Pages : taches et éclaboussures de sang ---------
       Le parchemin clair et l'encre brune restent ceux de livre.css ;
       seules les taches d'usure deviennent des traces de sang dilué. */
    .parchemin::before {
      background:
        radial-gradient(circle at 82% 14%, rgba(139, 15, 15, .13) 0 26px, transparent 42px),
        radial-gradient(circle at 12% 78%, rgba(120, 10, 10, .15) 0 18px, transparent 34px),
        radial-gradient(circle at 55% 96%, rgba(139, 15, 15, .10) 0 30px, transparent 48px),
        radial-gradient(circle at 30% 6%, rgba(139, 15, 15, .13) 0 6px, transparent 12px),
        radial-gradient(circle at 34% 10%, rgba(139, 15, 15, .10) 0 3px, transparent 7px),
        radial-gradient(circle at 91% 58%, rgba(120, 10, 10, .13) 0 5px, transparent 10px),
        radial-gradient(circle at 88% 64%, rgba(120, 10, 10, .09) 0 3px, transparent 6px),
        radial-gradient(circle at 7% 32%, rgba(139, 15, 15, .11) 0 4px, transparent 9px);
    }

    /* grande tache diluée, placée différemment une feuille sur deux
       pour que les pages ne semblent pas photocopiées */
    .parchemin::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      filter: blur(2px);
      background:
        radial-gradient(ellipse 90px 60px at 78% 84%, rgba(150, 20, 15, .085), rgba(150, 20, 15, .045) 55%, transparent 72%),
        radial-gradient(circle at 70% 78%, rgba(150, 20, 15, .07) 0 4px, transparent 9px);
    }

    .sheet:nth-child(odd) .parchemin::after {
      background:
        radial-gradient(ellipse 70px 95px at 16% 18%, rgba(150, 20, 15, .075), rgba(150, 20, 15, .04) 55%, transparent 72%),
        radial-gradient(circle at 25% 28%, rgba(150, 20, 15, .07) 0 4px, transparent 9px);
    }

    /* encadré de la page de garde : la règle des deux prix Mono ⁄ Bi
       doit sauter aux yeux dès l'ouverture du grimoire */
    .garde-note {
      display: block;
      margin-top: 26px;
      padding: 14px 20px;
      border: 3px double #8a2a1a;
      border-radius: 4px;
      background: rgba(160, 25, 20, .08);
      box-shadow: inset 0 0 12px rgba(160, 25, 20, .12);
      color: #6e1a12;
      font-size: 18px;
      line-height: 1.5;
    }

    /* --------- Encres --------- */
    .fam-suite { color: #8a2a1a; }
    .sort-cout { color: #8a1114; }
    .sommaire-titre { color: #4a1512; }
    .sommaire-ligne:hover .sommaire-nom { color: #a01313; }

    .sort.sort-hit {
      background: rgba(200, 70, 55, .28);
      outline-color: rgba(140, 25, 18, .65);
    }

    /* --------- Flèches de navigation --------- */
    .nav-fleche {
      border-color: #7a2a20;
      color: #4a1512;
    }

    /* --------- Allègement du rendu mobile ---------
       Même principe que livre.css : sur GPU de téléphone, on retire les
       effets les plus coûteux propres à ce thème (bruit SVG du cuir rouge,
       blur des éclaboussures de sang) tout en gardant leurs dégradés.
       Ces règles doivent rester APRÈS livre.css (chargé plus haut) pour
       l'emporter, et donc figurer ici, dans le style inline de la page. */
    @media (max-width: 899.98px) {
      .cuir {
        background: linear-gradient(120deg, #2a0808, #4a1010 45%, #260606 90%);
        box-shadow: inset 0 0 22px rgba(0, 0, 0, .72);
      }
      /* les éclaboussures de sang sont un calque plein-page DE PLUS par
         feuille (en plus des taches de livre.css, déjà masquées) : on le
         retire en mobile, où il coûte cher à composer pendant le feuilletage */
      .parchemin::after { display: none; }
    }
  </style>
</head>

<body>
  <script src="../commun.js"></script>

  <!-- Contenu de la page -->
  <main>
    <div class="grimoire-section">
      <h1 class="grimoire-titre">Le Grimoire Sanguinolent</h1>
      <p class="grimoire-sous-titre">Tous les sortilèges connus des hématomanciens de Legends & Bonk — une magie qui se paie en points de vie</p>

      <div class="recherche-sort">
        <div class="recherche-sort-box">
          <input type="text" id="rechercheSort" placeholder="✦ Chercher un sort…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="listeSorts" />
          <ul class="suggestions-sort" id="listeSorts" role="listbox"></ul>
        </div>
      </div>

      <div class="book-scene">
        <div class="book-viewport" id="bookViewport">
          <div class="book-scale" id="bookScale">
            <div class="book-wrap">
              <div class="book ferme-avant" id="book">
                <!-- feuilles et marque-pages générés en JS -->
              </div>
            </div>
          </div>
        </div>
        <button class="nav-fleche fleche-gauche" id="flechePrec" aria-label="Page précédente">‹</button>
        <button class="nav-fleche fleche-droite" id="flecheSuiv" aria-label="Page suivante">›</button>
      </div>

      <!-- Sur mobile, le JS déplace les deux flèches ici : sur les bords du
           livre elles recouvraient le texte. Sur grand écran, elles restent
           dans .book-scene, de part et d'autre du livre. -->
      <div class="nav-bar" id="navBar"></div>

      <div class="bookmarks-bar" id="bookmarksBar"></div>

      <p class="grimoire-aide" id="aideNav">Cliquez sur la couverture pour ouvrir le grimoire</p>
    </div>
  </main>

  <!-- Les sorts et les textes du grimoire (objet LIVRE), puis le moteur
       partagé avec le Grand Livre de la Magie. -->
  <script src="./sorts_sanguine.js"></script>
  <script src="./livre-moteur.js"></script>
</body>

</html>
