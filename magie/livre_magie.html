<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="./livre.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap"
    rel="stylesheet" />
  <title>Le Grand Livre de la Magie — Legends & Bonk</title>
  <meta name="description" content="Le Grand Livre de la Magie de Legends & Bonk : tous les sorts et familles de magie de notre jeu de rôle." />
  <link rel="canonical" href="https://legendsandbonk.com/magie/livre_magie.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Legends &amp; Bonk" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Le Grand Livre de la Magie — Legends & Bonk" />
  <meta property="og:description" content="Le Grand Livre de la Magie de Legends & Bonk : tous les sorts et familles de magie de notre jeu de rôle." />
  <meta property="og:url" content="https://legendsandbonk.com/magie/livre_magie.html" />
  <meta property="og:image" content="https://legendsandbonk.com/image/image_pala_presentation.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../image/logo_l_and_b.png" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body>
  <script src="../commun.js"></script>

  <!-- Contenu de la page -->
  <main>
    <div class="grimoire-section">
      <h1 class="grimoire-titre">Le Grand Livre de la Magie</h1>
      <p class="grimoire-sous-titre">Tous les sortilèges connus des mages de Legends & Bonk</p>

      <div class="recherche-sort">
        <input type="text" id="rechercheSort" list="listeSorts" placeholder="✦ Chercher un sort…" autocomplete="off" />
        <datalist id="listeSorts"></datalist>
      </div>

      <div class="book-scene">
        <div class="book-viewport" id="bookViewport">
          <div class="book-scale" id="bookScale">
            <div class="book-wrap">
              <div class="book ferme-avant" id="book">
                <!-- feuilles et marque-pages générés en JS -->
              </div>
            </div>
          </div>
        </div>
        <button class="nav-fleche fleche-gauche" id="flechePrec" aria-label="Page précédente">‹</button>
        <button class="nav-fleche fleche-droite" id="flecheSuiv" aria-label="Page suivante">›</button>
      </div>

      <!-- Sur mobile, le JS déplace les deux flèches ici : sur les bords du
           livre elles recouvraient le texte. Sur grand écran, elles restent
           dans .book-scene, de part et d'autre du livre. -->
      <div class="nav-bar" id="navBar"></div>

      <div class="bookmarks-bar" id="bookmarksBar"></div>

      <p class="grimoire-aide" id="aideNav">Cliquez sur la couverture pour ouvrir le grimoire</p>
    </div>
  </main>

  <!-- Les sorts et les textes du livre (objet LIVRE), puis le moteur
       partagé avec le grimoire sanguinolent. -->
  <script src="./sorts.js"></script>
  <script src="./livre-moteur.js"></script>
</body>

</html>
