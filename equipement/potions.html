<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet" />
  <title>Les potions — Legends & Bonk</title>
  <meta name="description" content="Les potions de Legends & Bonk : l'étagère de l'apothicaire — effets tirés au D20, paliers de puissance et prix par quantité." />
  <link rel="canonical" href="https://legendsandbonk.com/equipement/potions.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Legends &amp; Bonk" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Les potions — Legends & Bonk" />
  <meta property="og:description" content="Les potions de Legends & Bonk : l'étagère de l'apothicaire — effets tirés au D20, paliers de puissance et prix par quantité." />
  <meta property="og:url" content="https://legendsandbonk.com/equipement/potions.html" />
  <meta property="og:image" content="https://legendsandbonk.com/image/og_partage.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../image/logo_l_and_b.png" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --wood1: #2a2338; --wood2: #201a2e; --wood3: #171222;
      --plank1: #4a3a2e; --plank2: #33261d; --plankLip: #170f1c;
      --parch: #f3e7cb; --parch2: #e7d5ae; --ink: #34260f; --line: #c9b892;
      --brun: #281b07; --bordeaux: #7a0808; --gold: #d8b24a; --muted: #6b5a3a;
      --moon: #cdd8ff; --rune: #a9e8e0; --candle: #ffb14a;
    }

    /* ---- cabinet en bois embarqué dans la page blanche ---- */
    .pot-wrap { max-width: 1180px; margin: 22px auto 60px; padding: 0 12px; color: var(--ink); }
    .pot-title { text-align: center; font-weight: 700; letter-spacing: .5px; margin: 4px 0 2px; color: var(--brun); }
    .pot-sub { text-align: center; color: #6b5a3a; font-style: italic; margin-bottom: 8px; }

    .pot-hint {
      display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap;
      max-width: 760px; margin: 0 auto 18px; padding: 9px 16px; text-align: center;
      background: rgba(216,178,74,.12); border: 1px solid rgba(122,8,8,.18); border-radius: 10px;
      color: #6b5a3a; font-size: 16px;
    }
    .pot-hint b { color: var(--bordeaux); }
    .pot-hint svg { width: 20px; height: 20px; color: var(--bordeaux); flex: 0 0 auto; }

    /* barre de filtres / raccourcis vers les étagères */
    .pot-filters {
      position: sticky; top: 8px; z-index: 30; margin-bottom: 16px;
      background: rgba(255,255,255,.96); backdrop-filter: blur(4px);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
      transition: transform .28s ease, opacity .28s ease;
    }
    .pot-filters.pot-hidden { transform: translateY(-140%); opacity: 0; pointer-events: none; }
    .pot-search {
      width: 100%; font-family: inherit; font-weight: 600; font-size: 20px; padding: 8px 14px;
      border: 1px solid var(--line); border-radius: 8px; background: #fffdf6; color: var(--ink);
    }
    .pot-search:focus { outline: 2px solid var(--bordeaux); border-color: var(--bordeaux); }
    .pot-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pot-cat {
      font-family: inherit; font-size: 15px; font-weight: 600; padding: 4px 13px; border-radius: 999px;
      cursor: pointer; border: 1px solid var(--line); background: #fffdf6; color: var(--ink); transition: all .15s;
    }
    .pot-cat:hover { border-color: var(--bordeaux); }
    .pot-cat.active { background: var(--bordeaux); color: #fff; border-color: var(--bordeaux); }
    .pot-cat:focus-visible { outline: 2px solid var(--bordeaux); outline-offset: 2px; }

    /* ===== l'échoppe de nuit ===== */
    .shop {
      position: relative; overflow: hidden;
      border: 12px solid #17111f; border-radius: 18px;
      box-shadow: inset 0 0 90px rgba(0,0,0,.7), 0 16px 42px rgba(10,8,20,.5);
      /* mur en planches sombres */
      background:
        radial-gradient(120% 50% at 50% 0%, rgba(120,140,210,.06), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 3px, rgba(0,0,0,.06) 3px 6px),
        repeating-linear-gradient(90deg, #2a2338 0 84px, #241d31 84px 87px, #191325 87px 90px, #2a2338 90px 92px);
    }
    /* ferrures aux quatre coins */
    .shop::before {
      content: ""; position: absolute; inset: 5px; border-radius: 12px; pointer-events: none; z-index: 9;
      border: 2px solid rgba(0,0,0,.4);
      box-shadow:
        14px 14px 0 -6px #b8974a, calc(100% - 14px) 14px 0 -6px #b8974a,
        14px calc(100% - 14px) 0 -6px #b8974a, calc(100% - 14px) calc(100% - 14px) 0 -6px #b8974a;
    }

    /* clair de lune (haut) + lueur chaude des bougies (bas) + vignette */
    .shop-glow {
      position: absolute; inset: 0; z-index: 8; pointer-events: none;
      background:
        radial-gradient(58% 260px at 50% 1%, rgba(150,175,240,.22), transparent 72%),
        radial-gradient(60% 220px at 50% 100%, rgba(255,160,70,.16), transparent 74%),
        linear-gradient(90deg, rgba(0,0,0,.5), transparent 12%, transparent 88%, rgba(0,0,0,.5)),
        linear-gradient(180deg, rgba(0,0,0,.34), transparent 9%, transparent 90%, rgba(0,0,0,.4));
    }

    /* le cabinet contient les étagères ; espace en haut pour la fenêtre */
    .cabinet { position: relative; z-index: 2; padding: 240px 46px 12px; }
    .lintel {
      position: absolute; top: 0; left: 0; right: 0; z-index: 3; height: 18px;
      background: linear-gradient(180deg, #3a2f2a, #211812);
      border-bottom: 3px solid #120c14; box-shadow: 0 4px 10px rgba(0,0,0,.6);
    }

    /* ===== fenêtre en ogive ===== */
    .window {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      width: min(52%, 388px); height: 210px; z-index: 1;
      border-radius: 200px 200px 8px 8px / 172px 172px 8px 8px;
      background: linear-gradient(180deg, #46372e, #281d17);
      box-shadow: 0 0 50px rgba(120,140,205,.30), inset 0 0 0 2px #120c14;
    }
    .window .sky {
      position: absolute; inset: 8px; overflow: hidden;
      border-radius: 194px 194px 5px 5px / 166px 166px 5px 5px;
      background:
        radial-gradient(1.5px 1.5px at 20% 22%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 62% 12%, #dfe6ff, transparent),
        radial-gradient(1px 1px at 78% 30%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 40% 40%, #cdd8ff, transparent),
        radial-gradient(1px 1px at 30% 58%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 85% 55%, #fff, transparent),
        radial-gradient(1px 1px at 54% 68%, #eef, transparent),
        radial-gradient(2px 2px at 48% 26%, #eef2ff, transparent),
        linear-gradient(180deg, #27335c 0%, #1a2447 46%, #121834 100%);
    }
    /* meneaux (croix de la fenêtre) */
    .window .sky::after {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(90deg, transparent calc(50% - 1.5px), rgba(40,29,23,.95) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
        linear-gradient(180deg, transparent calc(52% - 1.5px), rgba(40,29,23,.95) calc(52% - 1.5px) calc(52% + 1.5px), transparent calc(52% + 1.5px));
    }
    .window .moon {
      position: absolute; top: 26px; right: 44px; width: 32px; height: 32px; border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, #fdf6e3, #d9cfa8);
      box-shadow: 0 0 22px rgba(253,246,227,.55);
    }
    /* rideau drapé à gauche */
    .window .curtain {
      position: absolute; top: 8px; left: 8px; width: 42%; height: 82%; z-index: 3; border-radius: 0 0 55% 25% / 0 0 34% 18%;
      background:
        repeating-linear-gradient(93deg, rgba(0,0,0,.16) 0 9px, rgba(255,255,255,.05) 9px 18px),
        linear-gradient(90deg, #46567e, #2c3757 60%, #1b2340);
      box-shadow: inset -8px 0 12px rgba(0,0,0,.45);
    }
    /* symboles mystiques gravés autour de l'arc */
    .window-runes {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: min(60%, 452px); height: 150px; z-index: 2; pointer-events: none;
      color: rgba(200,225,255,.5); filter: drop-shadow(0 0 3px rgba(150,180,255,.4));
    }

    /* fleurs séchées suspendues (mécanique .hang conservée) */
    .hangrow {
      position: absolute; top: 12px; left: 0; right: 0; z-index: 4; pointer-events: none;
      display: flex; justify-content: center; gap: 4px; padding: 0 26px;
    }
    .hang { position: relative; }
    .hang::before { content: ""; position: absolute; top: -2px; left: 50%; transform: translateX(-50%); width: 2px; height: var(--str, 22px); background: linear-gradient(#6a5a3a, #3a2f1e); }
    .hang > .obj { margin-top: var(--str, 22px); display: block; }
    /* les formes décoratives sont des <span> : forcer le mode bloc */
    .flower .bunch, .candle .stick, .lamp .glass, .lamp .cap, .lamp .base, .paper { display: block; }
    .flower { width: 42px; }
    .flower .bunch {
      width: 40px; height: 76px; margin: 0 auto; position: relative;
      clip-path: polygon(50% 100%, 10% 0, 90% 0);
      background:
        repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 3px, transparent 3px 7px),
        linear-gradient(180deg, #66782f 0%, #47591d 68%, #34461a 100%);
      filter: drop-shadow(0 3px 4px rgba(0,0,0,.45));
    }
    .flower .bunch::after {
      content: ""; position: absolute; left: 50%; bottom: 16px; width: 11px; height: 11px; border-radius: 50%;
      transform: translateX(-50%); background: radial-gradient(circle at 40% 34%, #f7b9d0, var(--fl, #d65a86));
      box-shadow:
        -12px 5px 0 -1px var(--fl, #d65a86), 12px 3px 0 -1px var(--fl2, #e77a9c),
        -6px 13px 0 -2px var(--fl2, #e77a9c), 7px 12px 0 -2px var(--fl, #d65a86),
        0 -4px 0 -2px var(--fl2, #e77a9c);
    }
    .flower.rouge { --fl: #c23a3a; --fl2: #e0665a; }
    .flower.violet { --fl: #9a5ec0; --fl2: #b98ad6; }

    /* piliers latéraux gravés de runes */
    .pillar {
      position: absolute; top: 0; bottom: 0; width: 30px; z-index: 5; pointer-events: none;
      background: linear-gradient(90deg, #241d31, #17111f 55%, #241d31);
      box-shadow: inset 0 0 22px rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center;
    }
    .pillar.left { left: 0; } .pillar.right { right: 0; }
    .pillar span {
      writing-mode: vertical-rl; text-orientation: upright; font-size: 17px; letter-spacing: 10px;
      color: var(--rune); opacity: .6; text-shadow: 0 0 8px rgba(120,230,215,.7);
    }

    /* bougie */
    .candle { position: relative; width: 20px; }
    .candle .stick {
      width: 20px; height: 44px; border-radius: 4px 4px 3px 3px; position: relative;
      background: linear-gradient(90deg, #efe3c6, #d3c39c 62%, #b9a77e);
      box-shadow: inset -3px 0 5px rgba(0,0,0,.18), 0 3px 6px rgba(0,0,0,.5);
    }
    .candle .stick::before { content: ""; position: absolute; bottom: -3px; left: 2px; right: 5px; height: 9px; background: #efe3c6; border-radius: 0 0 60% 50%; }
    .candle .flame {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 9px; height: 16px;
      border-radius: 50% 50% 50% 50% / 62% 62% 40% 40%;
      background: linear-gradient(180deg, #fff3b0, #ffb43c 55%, #ff7a1e);
      box-shadow: 0 0 16px 4px rgba(255,165,60,.7); animation: flick 1.2s ease-in-out infinite alternate;
    }
    @keyframes flick { from { transform: translateX(-50%) scaleY(.9) skewX(-4deg); } to { transform: translateX(-50%) scaleY(1.12) skewX(5deg); } }

    /* lampe à huile */
    .lamp { position: relative; width: 48px; }
    .lamp .glass {
      width: 48px; height: 44px; border-radius: 50% 50% 46% 46%; position: relative;
      background: radial-gradient(circle at 50% 62%, #fff0c0, #ffab40 55%, #a05e1e 100%);
      box-shadow: 0 0 34px 10px rgba(255,170,70,.55), inset 0 -6px 10px rgba(0,0,0,.25);
    }
    .lamp .glass::before { content: ""; position: absolute; top: 34px; left: 50%; transform: translateX(-50%); width: 8px; height: 14px; border-radius: 50% 50% 40% 40%; background: linear-gradient(#fff6c0, #ff9a2e); box-shadow: 0 0 10px 3px rgba(255,180,80,.9); }
    .lamp .cap { width: 20px; height: 10px; margin: 0 auto; background: linear-gradient(#6a6a72, #38383e); border-radius: 4px 4px 0 0; }
    .lamp .base { width: 30px; height: 8px; margin: -2px auto 0; background: linear-gradient(#5a5a62, #2c2c32); border-radius: 0 0 6px 6px; }

    /* poussière qui flotte */
    .dust { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
    .dust i {
      position: absolute; width: 3px; height: 3px; border-radius: 50%;
      background: rgba(200,215,255,.6); filter: blur(.5px); animation: motte linear infinite;
    }
    @keyframes motte {
      0% { transform: translateY(14px); opacity: 0; }
      12% { opacity: .7; } 88% { opacity: .45; }
      100% { transform: translateY(-46px); opacity: 0; }
    }

    /* comptoir gravé de symboles alchimiques */
    .counter {
      position: relative; z-index: 2; min-height: 104px; border-top: 3px solid #100b18;
      background: linear-gradient(180deg, #241b30, #140e20);
      box-shadow: inset 0 6px 14px rgba(0,0,0,.5);
      display: flex; align-items: flex-end; justify-content: center; padding: 14px 18px 16px;
      overflow: hidden; /* le sigil reste gravé dans le comptoir, ne déborde pas sur les étagères */
    }
    .counter .sigil {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 148px; height: 148px; opacity: .18; pointer-events: none; color: var(--rune);
    }
    .counter .props { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 30px; }
    .paper {
      width: 56px; height: 32px; transform: rotate(-4deg); position: relative;
      background: repeating-linear-gradient(180deg, #e9dcc0 0 8px, #e3d4b2 8px 9px);
      border-radius: 3px; box-shadow: 0 3px 6px rgba(0,0,0,.5);
    }
    .paper::before { content: ""; position: absolute; top: 5px; left: 6px; right: 6px; height: 2px; background: rgba(90,70,40,.4); box-shadow: 0 6px 0 rgba(90,70,40,.3), 0 12px 0 rgba(90,70,40,.25); }

    .shelf { padding-top: 20px; }
    .shelf-title {
      text-align: center; font-weight: 700; font-size: 26px; color: #f6e7c4;
      letter-spacing: .6px; margin: 6px 0 14px; text-shadow: 0 2px 4px rgba(0,0,0,.6);
    }
    .shelf-title span {
      display: inline-block; padding: 3px 22px;
      background: linear-gradient(180deg, #6a4526, #43290f);
      border: 1px solid #241608; border-radius: 8px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 3px 8px rgba(0,0,0,.4);
    }
    .shelf-title small { display: block; font-size: 13px; font-style: italic; color: #d8c197; font-weight: 400; letter-spacing: 0; }

    .shelf-items { display: flex; flex-wrap: wrap; justify-content: center; row-gap: 4px; }

    /* un flacon posé sur sa planche */
    .pot-slot {
      flex: 0 0 auto; width: 152px; position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 6px 0; cursor: pointer; background: transparent; border: 0; font-family: inherit;
    }
    .pot-bottle {
      position: relative; height: 138px; display: flex; align-items: flex-end; justify-content: center;
      width: 100%;
    }
    /* halo coloré derrière le flacon */
    .pot-bottle::before {
      content: ""; position: absolute; left: 50%; top: 46%; width: 120px; height: 120px;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
      opacity: .55; filter: blur(4px); transition: opacity .2s, transform .2s;
    }
    .pot-bottle img {
      position: relative; z-index: 1; max-height: 132px; max-width: 92%; object-fit: contain;
      filter: drop-shadow(0 8px 6px rgba(0,0,0,.45));
      transition: transform .18s ease;
    }
    /* reflet au sol sur la planche */
    .pot-bottle::after {
      content: ""; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
      width: 74px; height: 12px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,0,0,.5) 0%, transparent 70%);
    }
    .pot-slot:hover .pot-bottle img, .pot-slot:focus-visible .pot-bottle img { transform: translateY(-8px) scale(1.05); }
    .pot-slot:hover .pot-bottle::before, .pot-slot:focus-visible .pot-bottle::before { opacity: .95; transform: translate(-50%, -54%) scale(1.12); }
    .pot-slot:focus-visible { outline: none; }
    .pot-slot:focus-visible .pot-name { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(216,178,74,.6), 0 3px 6px rgba(0,0,0,.5); }

    /* la planche : bord avant en 3D, continue d'un flacon à l'autre */
    .pot-plank {
      width: 100%; height: 15px; margin-top: 2px;
      background: linear-gradient(180deg, var(--plank1), var(--plank2));
      border-top: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 5px 0 var(--plankLip), 0 10px 14px rgba(0,0,0,.5);
    }

    /* étiquette gravée avec le nom */
    .pot-name {
      margin-top: 16px; max-width: 100%; text-align: center; line-height: 1.12;
      /* les noms longs (« …empoisonnement ») se coupent au lieu de déborder de l'étiquette */
      overflow-wrap: break-word; word-break: break-word; hyphens: auto;
      font-size: 13.5px; font-weight: 700; color: #f2e4c4;
      padding: 5px 9px; border-radius: 6px;
      background: linear-gradient(180deg, #5a3c22, #3c2612);
      border: 1px solid #241608;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 5px rgba(0,0,0,.4);
      transition: border-color .15s, box-shadow .15s;
    }
    .pot-slot:hover .pot-name { border-color: var(--gold); }

    .shelf-empty { text-align: center; color: #e7d5ae; font-style: italic; padding: 26px 0; }

    /* ===== FICHE — étiquette de parchemin qui se déroule ===== */
    .pot-overlay {
      position: fixed; inset: 0; z-index: 1050; display: none;
      align-items: flex-start; justify-content: center; padding: 4vh 14px 6vh;
      background: rgba(20,12,4,.62); backdrop-filter: blur(3px); overflow-y: auto;
    }
    .pot-overlay.open { display: flex; }
    .scroll {
      position: relative; width: min(680px, 100%); margin: auto 0;
      transform-origin: top center; transform: scaleY(.02); opacity: 0;
    }
    .pot-overlay.open .scroll { animation: unroll .42s cubic-bezier(.2,.8,.25,1) forwards; }
    @keyframes unroll {
      0% { transform: scaleY(.02); opacity: 0; }
      55% { opacity: 1; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    /* rouleaux haut/bas */
    .scroll-rod {
      height: 22px; border-radius: 11px; margin: 0 -6px;
      background: linear-gradient(180deg, #6a4526, #3c2612);
      border: 1px solid #241608; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 4px 10px rgba(0,0,0,.5);
      position: relative; z-index: 2;
    }
    .scroll-body {
      background: linear-gradient(180deg, var(--parch), var(--parch2));
      border-left: 2px solid #d3c096; border-right: 2px solid #d3c096;
      padding: 22px 26px 26px; color: var(--ink);
      box-shadow: inset 0 0 40px rgba(120,90,40,.18);
    }

    .fiche-top { display: flex; gap: 20px; align-items: flex-start; }
    .fiche-illu {
      flex: 0 0 130px; position: relative; display: flex; align-items: flex-end; justify-content: center;
      height: 180px;
    }
    .fiche-illu::before {
      content: ""; position: absolute; left: 50%; top: 48%; width: 130px; height: 130px;
      transform: translate(-50%,-50%); border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 66%); opacity: .6; filter: blur(5px);
    }
    .fiche-illu img { position: relative; z-index: 1; max-height: 178px; max-width: 100%; filter: drop-shadow(0 8px 8px rgba(0,0,0,.4)); }
    .fiche-head { flex: 1 1 auto; min-width: 0; }
    .fiche-name { font-size: 30px; font-weight: 700; color: var(--brun); line-height: 1.05; margin: 2px 0 2px; text-wrap: balance; }
    .fiche-cat { font-style: italic; color: var(--bordeaux); font-size: 17px; margin: 0 0 10px; }
    .fiche-note { font-size: 16px; line-height: 1.4; color: #4a3a1c; margin: 4px 0 0; }

    .sect-h {
      font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      color: #8a6d34; margin: 20px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 4px;
    }
    table.paliers { width: 100%; border-collapse: collapse; }
    table.paliers td { padding: 7px 8px; border-bottom: 1px solid rgba(160,140,90,.4); font-size: 16px; vertical-align: top; }
    table.paliers tr:last-child td { border-bottom: none; }
    .pal-name { white-space: nowrap; width: 1%; }
    .pal-name b {
      display: inline-block; font-weight: 800; font-size: 14px; padding: 2px 10px; border-radius: 999px;
      color: #fff; background: var(--glowSolid); box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .pal-roll { white-space: nowrap; width: 1%; color: var(--bordeaux); font-weight: 700; font-variant-numeric: tabular-nums; padding-right: 14px; }
    .pal-eff { color: #34260f; }

    table.prix { width: 100%; border-collapse: collapse; }
    table.prix th, table.prix td { padding: 7px 10px; font-size: 16px; text-align: left; }
    table.prix thead th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #8a6d34; border-bottom: 1px solid var(--line); }
    table.prix tbody td { border-bottom: 1px solid rgba(160,140,90,.35); }
    table.prix tbody tr:last-child td { border-bottom: none; }
    .qte-nom { font-weight: 700; color: var(--brun); }
    .qte-us { color: #7a6738; font-size: 14px; }
    .qte-prix { text-align: right; font-weight: 700; color: #7a5410; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .qte-prix .mc { font-size: 12px; font-weight: 600; color: #9a865a; margin-left: 3px; }
    .prix-none { color: #7a6738; font-style: italic; font-size: 16px; }

    .fiche-close {
      position: absolute; top: -10px; right: -6px; z-index: 3;
      width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      background: linear-gradient(180deg, #6a4526, #3c2612); color: #f2e4c4;
      border: 1px solid #241608; font-size: 22px; line-height: 1; font-family: inherit;
      box-shadow: 0 3px 8px rgba(0,0,0,.5);
    }
    .fiche-close:hover { color: #fff; }
    .fiche-close:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .pot-overlay.open .scroll { animation: none; transform: scaleY(1); opacity: 1; }
      .dust { display: none; }
      .candle .flame { animation: none; }
      * { transition: none !important; }
    }
    @media (max-width: 640px) {
      .pot-title { font-size: 1.6rem; }
      .pot-slot { width: 33.33%; }
      .pot-bottle { height: 104px; }
      .pot-bottle img { max-height: 98px; }
      .pot-bottle::before { width: 88px; height: 88px; }
      .pot-name { font-size: 12px; margin-top: 12px; }
      .cabinet { padding: 170px 10px 6px; }
      .window { width: 66%; height: 150px; top: 14px; }
      .window .moon { width: 24px; height: 24px; top: 18px; right: 26px; }
      .hangrow { top: 8px; padding: 0 8px; }
      .hang.opt { display: none; }
      .flower .bunch { height: 60px; }
      .pillar { display: none; }
      .counter .props { gap: 18px; }
      .shelf-title { font-size: 21px; }
      .fiche-top { flex-direction: column; align-items: center; text-align: center; }
      .fiche-illu { flex: none; width: 150px; height: 200px; }
      .fiche-illu img { max-height: 192px; }
      .fiche-name { font-size: 25px; }
      .scroll-body { padding: 18px 16px 20px; }
      .pal-roll { padding-right: 8px; }
    }
  </style>
</head>

<body>
  <script src="../commun.js"></script>

  <main>
    <div class="pot-wrap">
      <h1 class="pot-title">Les potions</h1>
      <p class="pot-sub">La boutique de l'apothicaire à la nuit tombée — attrapez un flacon pour lire son étiquette</p>

      <p class="pot-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 2v20M3 7l9 5 9-5M12 12l9 5M12 12 3 17"/></svg>
        <span>Chaque potion a une <b>puissance tirée au D20</b> à l'usage.</span>
      </p>

      <div class="pot-filters">
        <input id="recherche" class="pot-search" type="search" placeholder="Rechercher une potion…" autocomplete="off" aria-label="Rechercher une potion" />
        <div id="cats" class="pot-cats"></div>
      </div>

      <div class="shop">
        <div class="lintel" aria-hidden="true"></div>

        <!-- fenêtre en ogive étoilée + rideau -->
        <div class="window" aria-hidden="true">
          <div class="sky"></div>
          <div class="moon"></div>
          <div class="curtain"></div>
        </div>
        <!-- symboles mystiques gravés autour de l'arc -->
        <svg class="window-runes" viewBox="0 0 452 150" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M20 150 A210 150 0 0 1 432 150" stroke-width="1" stroke-dasharray="2 9"/>
          <path d="M6 150 A222 148 0 0 1 446 150" stroke-width="0.8" opacity=".55"/>
          <circle cx="226" cy="6" r="2.2"/><circle cx="120" cy="34" r="1.6"/><circle cx="332" cy="34" r="1.6"/>
          <circle cx="58" cy="86" r="1.6"/><circle cx="394" cy="86" r="1.6"/>
          <g font-size="15" fill="currentColor" stroke="none" text-anchor="middle" font-family="serif">
            <text x="226" y="26">✶</text><text x="150" y="20">☾</text><text x="302" y="20">✦</text>
            <text x="86" y="58">✧</text><text x="366" y="58">✧</text>
          </g>
        </svg>

        <!-- fleurs séchées suspendues -->
        <div class="hangrow" aria-hidden="true">
          <span class="hang" style="--str:30px"><span class="obj flower"><span class="bunch"></span></span></span>
          <span class="hang opt" style="--str:56px"><span class="obj flower rouge"><span class="bunch"></span></span></span>
          <span class="hang" style="--str:20px"><span class="obj flower violet"><span class="bunch"></span></span></span>
          <span class="hang opt" style="--str:62px"><span class="obj flower rouge"><span class="bunch"></span></span></span>
          <span class="hang" style="--str:38px"><span class="obj flower"><span class="bunch"></span></span></span>
        </div>

        <!-- piliers latéraux gravés de runes -->
        <div class="pillar left" aria-hidden="true"><span>ᚠᚦᚨᛉᛟᚹ</span></div>
        <div class="pillar right" aria-hidden="true"><span>ᚱᛊᛜᚷᛞᛒ</span></div>

        <div class="cabinet" id="cabinet"></div>

        <!-- comptoir gravé de symboles alchimiques -->
        <div class="counter" aria-hidden="true">
          <svg class="sigil" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1">
            <circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="38"/>
            <polygon points="50,12 84,72 16,72"/><polygon points="50,88 16,28 84,28"/>
            <circle cx="50" cy="50" r="13"/><path d="M50 4v92M4 50h92"/>
          </svg>
          <div class="props">
            <span class="candle"><span class="stick"><span class="flame"></span></span></span>
            <span class="paper"></span>
            <span class="lamp"><span class="cap"></span><span class="glass"></span><span class="base"></span></span>
            <span class="candle"><span class="stick" style="height:32px"><span class="flame"></span></span></span>
          </div>
        </div>

        <!-- poussière + lumière -->
        <div class="dust" aria-hidden="true">
          <i style="left:12%;top:40%;animation-duration:9s;animation-delay:0s"></i>
          <i style="left:24%;top:65%;animation-duration:11s;animation-delay:1.5s"></i>
          <i style="left:38%;top:30%;animation-duration:8s;animation-delay:3s"></i>
          <i style="left:52%;top:70%;animation-duration:12s;animation-delay:.8s"></i>
          <i style="left:66%;top:45%;animation-duration:10s;animation-delay:2.2s"></i>
          <i style="left:78%;top:60%;animation-duration:9.5s;animation-delay:4s"></i>
          <i style="left:88%;top:35%;animation-duration:11.5s;animation-delay:1s"></i>
        </div>
        <div class="shop-glow" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <!-- fiche (étiquette qui se déroule) -->
  <div class="pot-overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="fiche-name">
    <div class="scroll" id="scroll"></div>
  </div>

  <script src="potions-data.js"></script>
  <script>
    (function () {
      var DB = window.EQUIP_POTIONS || { categoriesOrdre: [], quantites: [], objets: [] };
      var IMG_BASE = "../image-db/equipement/potions/";
      var QTES = DB.quantites || [];
      var OBJETS = DB.objets || [];

      var $ = function (id) { return document.getElementById(id); };
      var esc = function (s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; };
      var norm = function (s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };
      var fmtPrix = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + ' <span class="mc">MC</span>'; };

      OBJETS.forEach(function (o) { o._n = norm(o.nom); });

      var presentes = {};
      OBJETS.forEach(function (o) { presentes[o.categorie] = true; });
      var CATS = ["Toutes"].concat((DB.categoriesOrdre || []).filter(function (c) { return presentes[c]; }));
      var catActive = "Toutes", recherche = "";

      function renderCats() {
        $("cats").innerHTML = CATS.map(function (c) {
          return '<button type="button" class="pot-cat' + (c === catActive ? " active" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
        }).join("");
      }

      function filtrer() {
        var q = norm(recherche);
        return OBJETS.filter(function (o) {
          return (catActive === "Toutes" || o.categorie === catActive) && (!q || o._n.indexOf(q) >= 0);
        });
      }

      function bottleHTML(o) {
        var style = "--glow:" + o.glow + ";";
        return '<button type="button" class="pot-slot" data-slug="' + esc(o.slug) + '" style="' + style + '" aria-label="' + esc(o.nom) + '">' +
          '<span class="pot-bottle"><img src="' + IMG_BASE + encodeURIComponent(o.img) + '" alt="" loading="lazy"></span>' +
          '<span class="pot-plank"></span>' +
          '<span class="pot-name">' + esc(o.nom) + '</span>' +
          '</button>';
      }

      function renderCabinet() {
        var list = filtrer();
        if (!list.length) {
          $("cabinet").innerHTML = '<p class="shelf-empty">Aucune potion ne correspond à votre recherche.</p>';
          return;
        }
        var byCat = {};
        list.forEach(function (o) { (byCat[o.categorie] = byCat[o.categorie] || []).push(o); });
        var cats = CATS.filter(function (c) { return c !== "Toutes" && byCat[c]; });

        $("cabinet").innerHTML = cats.map(function (c) {
          var n = byCat[c].length;
          return '<section class="shelf" data-cat="' + esc(c) + '">' +
            '<h2 class="shelf-title"><span>' + esc(c) + '<small>' + n + (n > 1 ? ' potions' : ' potion') + '</small></span></h2>' +
            '<div class="shelf-items">' + byCat[c].map(bottleHTML).join("") + '</div>' +
          '</section>';
        }).join("");
      }

      // ---- fiche ----
      function paliersHTML(o) {
        if (!o.tiers || !o.tiers.length) return "";
        var rows = o.tiers.map(function (t) {
          return '<tr>' +
            '<td class="pal-name"><b>' + esc(t.nom) + '</b></td>' +
            '<td class="pal-roll">' + esc(t.roll) + '</td>' +
            '<td class="pal-eff">' + esc(t.effet) + '</td>' +
          '</tr>';
        }).join("");
        return '<div class="sect-h">Paliers de puissance (D20)</div>' +
          '<table class="paliers">' + rows + '</table>';
      }

      function prixHTML(o) {
        if (o.prix == null) {
          return '<div class="sect-h">Prix</div><p class="prix-none">Potion hors commerce — impossible à acheter.</p>';
        }
        var rows;
        if (o.prix.length === 1) {
          rows = '<tr><td><span class="qte-nom">Petite</span> <span class="qte-us">(1 utilisation)</span></td>' +
                 '<td class="qte-prix">' + fmtPrix(o.prix[0]) + '</td></tr>';
        } else {
          rows = QTES.map(function (q, i) {
            if (o.prix[i] == null) return "";
            return '<tr><td><span class="qte-nom">' + esc(q.nom) + '</span> <span class="qte-us">(' + esc(q.usages) + ')</span></td>' +
              '<td class="qte-prix">' + fmtPrix(o.prix[i]) + '</td></tr>';
          }).join("");
        }
        return '<div class="sect-h">Prix par quantité</div>' +
          '<table class="prix"><tbody>' + rows + '</tbody></table>';
      }

      function ficheHTML(o) {
        var note = o.note ? '<p class="fiche-note">' + esc(o.note) + '</p>' : '';
        return '<button type="button" class="fiche-close" id="fiche-close" aria-label="Fermer">×</button>' +
          '<div class="scroll-rod"></div>' +
          '<div class="scroll-body" style="--glow:' + o.glow + ';--glowSolid:' + o.glow + '">' +
            '<div class="fiche-top">' +
              '<figure class="fiche-illu"><img src="' + IMG_BASE + encodeURIComponent(o.img) + '" alt="' + esc(o.nom) + '"></figure>' +
              '<div class="fiche-head">' +
                '<h2 class="fiche-name" id="fiche-name">' + esc(o.nom) + '</h2>' +
                '<p class="fiche-cat">' + esc(o.categorie) + '</p>' +
                note +
              '</div>' +
            '</div>' +
            paliersHTML(o) +
            prixHTML(o) +
          '</div>' +
          '<div class="scroll-rod"></div>';
      }

      var lastFocus = null;
      function openFiche(slug) {
        var o = OBJETS.filter(function (x) { return x.slug === slug; })[0];
        if (!o) return;
        lastFocus = document.activeElement;
        $("scroll").innerHTML = ficheHTML(o);
        $("overlay").classList.add("open");
        document.body.style.overflow = "hidden";
        var btn = $("fiche-close");
        if (btn) btn.focus();
      }
      function closeFiche() {
        $("overlay").classList.remove("open");
        document.body.style.overflow = "";
        $("scroll").innerHTML = "";
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }

      // ---- events ----
      $("recherche").addEventListener("input", function (e) { recherche = e.target.value; renderCabinet(); });
      $("cats").addEventListener("click", function (e) {
        var b = e.target.closest(".pot-cat"); if (!b) return;
        catActive = b.getAttribute("data-cat"); renderCats(); renderCabinet();
      });
      $("cabinet").addEventListener("click", function (e) {
        var b = e.target.closest(".pot-slot"); if (!b) return;
        openFiche(b.getAttribute("data-slug"));
      });
      $("overlay").addEventListener("click", function (e) {
        if (e.target === $("overlay") || e.target.closest("#fiche-close")) closeFiche();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && $("overlay").classList.contains("open")) closeFiche();
      });

      // masque la barre de filtres au défilement vers le bas, la révèle vers le haut
      var filtres = document.querySelector(".pot-filters");
      var lastY = window.scrollY || 0;
      window.addEventListener("scroll", function () {
        var y = window.scrollY || window.pageYOffset || 0;
        if (y < 90) { filtres.classList.remove("pot-hidden"); lastY = y; return; }
        var diff = y - lastY;
        if (diff > 8) filtres.classList.add("pot-hidden");
        else if (diff < -8) filtres.classList.remove("pot-hidden");
        lastY = y;
      }, { passive: true });

      renderCats();
      renderCabinet();
    })();
  </script>
</body>

</html>
